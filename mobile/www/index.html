<!--
  شاشة الانطلاق المحلية داخل التطبيق.
  الخادم على خطة ريندر المجانية ينام بعد ربع ساعة من الخمول، وإيقاظه يأخذ
  حتى دقيقة. فبدل صفحة بيضاء صامتة تبقى هذه الشاشة، وتسأل الخادم عن /health
  حتى يجيب، ثم تنتقل إليه. وهي أيضًا صفحة الخطأ التي يعود إليها التطبيق إن
  تعذّر تحميل الموقع (server.errorPath)، فتعيد المحاولة من نفسها.
-->
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#071410;color:#eaf5ee;
  font-family:-apple-system,system-ui,"SF Arabic","Geeza Pro",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  background:radial-gradient(900px 420px at 80% -10%,#12331f 0%,transparent 60%),#071410}
.wrap{width:100%;max-width:340px;text-align:center}
.mark{width:96px;height:96px;margin:0 auto 18px;display:block}
h1{font-size:22px;margin:0 0 6px;font-weight:700}
#msg{color:#8fae9c;font-size:14.5px;line-height:1.8;min-height:52px;margin:0}
.bar{height:4px;border-radius:999px;background:#17341f;overflow:hidden;margin:20px auto 0;width:160px}
.bar i{display:block;height:100%;width:40%;border-radius:999px;
  background:linear-gradient(90deg,#a3e635,#16a34a);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
button{margin-top:22px;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-size:15px;
  font-weight:700;color:#06210f;background:linear-gradient(135deg,#a3e635,#16a34a)}
button:active{opacity:.8}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>

  <h1>قوانين اللعبة</h1>
  <p id="msg">جارٍ الاتصال…</p>
  <div class="bar" id="bar"><i></i></div>
  <button id="retry" hidden onclick="start()">إعادة المحاولة</button>
</div>
<script>
var SITE = "https://other-refereea.onrender.com";
var GIVE_UP = 150000;     // دقيقتان ونصف: إيقاظ الخادم المجاني لا يتجاوز الدقيقة عادةً
var running = false, slowT = null;

var TEXT = {
  connecting: "جارٍ الاتصال…",
  waking: "الخادم يستيقظ بعد فترة خمول، قد يستغرق ذلك دقيقة.",
  offline: "لا يوجد اتصال بالإنترنت. تحقّق من الشبكة وسنكمل تلقائيًا.",
  failed: "تعذّر الوصول إلى الخادم. حاول مرة أخرى بعد قليل."
};
function show(state){
  document.getElementById("msg").textContent = TEXT[state];
  var busy = state === "connecting" || state === "waking";
  document.getElementById("bar").hidden = !busy;
  document.getElementById("retry").hidden = busy;
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

// الخادم يجيب بحالته من /health ويسمح لهذه الصفحة بقراءتها (CORS).
// صفحة الانتظار التي قد يعرضها ريندر أثناء الإقلاع ليست JSON، فتُعاد المحاولة.
async function ping(){
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, 25000);
  try{
    var r = await fetch(SITE + "/health", {cache: "no-store", signal: ctl.signal});
    var d = await r.json();
    return !!(d && d.status === "ok");
  }catch(e){ return false; }
  finally{ clearTimeout(t); }
}

async function start(){
  if(running) return;
  running = true;
  var began = Date.now();
  show("connecting");
  clearTimeout(slowT);
  slowT = setTimeout(function(){ if(running) show("waking"); }, 3500);
  while(true){
    if(navigator.onLine === false){ running = false; show("offline"); return; }
    if(await ping()){ location.replace(SITE + "/"); return; }
    if(Date.now() - began > GIVE_UP){ running = false; show("failed"); return; }
    await sleep(2000);
  }
}
addEventListener("online", function(){ start(); });
start();
</script>
