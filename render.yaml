services:
  - type: web
    name: other-refereea
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    # خيط واحد لا يكفي على الخطة المجانية: أي طلب بطيء يوقف بقية الطلبات.
    # ومهلة أطول تحمي أول طلب بعد الإقلاع البارد من أن يُقتل قبل أن يكتمل.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13"
      # سرّ يحمي مسار إرسال الإشعارات اليومية من الاستدعاء العلني.
      # يجب أن تحمله ترويسة X-Cron-Secret في نداء المجدول الخارجي.
      - key: CRON_SECRET
        generateValue: true
      # رابط قاعدة بيانات PostgreSQL خارجية ودائمة.
      # بدونه يستخدم التطبيق ملف SQLite داخل الحاوية، وهذا الملف يُمحى
      # عند كل إعادة تشغيل أو نشر، فتضيع الحسابات والتقدّم.
      - key: DATABASE_URL
        sync: false
      # إشعارات تطبيق آيفون عبر آبل. المفتاح من بوّابة المطوّر:
      # Certificates, Identifiers & Profiles ← Keys ← Apple Push Notifications service.
      # APNS_KEY محتوى ملف ‎.p8‎ كاملًا، و APNS_KEY_ID معرّفه، و APNS_TEAM_ID معرّف الفريق.
      - key: APNS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      # 1 يخفي صور صفحات الكتاب من تطبيق آيفون وحده فورًا، إن اعترضت آبل على المحتوى
      - key: APP_HIDE_BOOK
        value: "0"
      # بريد التواصل في صفحتي /privacy و /support اللتين يشترطهما المتجر
      - key: CONTACT_EMAIL
        sync: false
