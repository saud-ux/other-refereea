services:
  - type: web
    name: other-refereea
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    # خيط واحد لا يكفي على الخطة المجانية: أي طلب بطيء يوقف بقية الطلبات.
    # ومهلة أطول تحمي أول طلب بعد الإقلاع البارد من أن يُقتل قبل أن يكتمل.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13"
      # سرّ يحمي مسار إرسال الإشعارات اليومية من الاستدعاء العلني.
      # يجب أن تحمله ترويسة X-Cron-Secret في نداء المجدول الخارجي.
      - key: CRON_SECRET
        generateValue: true
      # رابط قاعدة بيانات PostgreSQL خارجية ودائمة.
      # بدونه يستخدم التطبيق ملف SQLite داخل الحاوية، وهذا الملف يُمحى
      # عند كل إعادة تشغيل أو نشر، فتضيع الحسابات والتقدّم.
      - key: DATABASE_URL
        sync: false
