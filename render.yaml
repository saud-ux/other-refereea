services:
  - type: web
    name: lotg-referee
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lotg-referee-db
          property: connectionString

databases:
  - name: lotg-referee-db
    plan: free
